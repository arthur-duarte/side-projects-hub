name: Roku Livre Android APK

on:
  push:
    paths:
      - 'roku-livre/**'
      - '.github/workflows/roku-livre-android.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Instalar Android SDK 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Compilar APK de testes
        working-directory: roku-livre
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Roku-Livre-APK
          path: roku-livre/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
